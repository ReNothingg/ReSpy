[project]
name = "respy-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiogram==3.30.0",
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "telethon>=1.40,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
respy-bot = "app.main:run"
respy-auth-user = "app.auth_user_session:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
